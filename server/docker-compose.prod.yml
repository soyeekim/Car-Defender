# 운영용 덮어쓰기 파일. 항상 base와 함께 쓴다.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# deploy/*.sh 스크립트는 이 조합을 알아서 붙인다.
#
# base와 달라지는 점
#   - nginx가 443을 열고 TLS 설정을 쓴다
#   - 인증서 발급·갱신용 certbot 컨테이너가 붙는다
#   - app은 빌드하지 않고 .env의 APP_IMAGE를 받아 쓴다

services:
  app:
    build: !reset null
    restart: unless-stopped

  db:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # 6시간마다 reload해서 갱신된 인증서를 반영한다.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 12시간마다 갱신을 시도한다. 만료 30일 전부터만 실제로 갱신된다.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  certbot-conf:
  certbot-www:
