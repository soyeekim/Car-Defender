# HTTPS용 nginx 설정. deploy/issue-cert.sh로 인증서를 먼저 받은 뒤에 쓴다.
# 인증서 파일이 없으면 nginx가 뜨지 않는다.
#
# 도메인을 바꾸려면 이 파일의 api.fairway.click 세 군데와
# deploy/issue-cert.sh의 기본값을 같이 고친다.

server {
    listen 80;
    server_name _;

    # Let's Encrypt 발급·갱신용 경로. 리다이렉트보다 먼저 와야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.fairway.click;

    ssl_certificate     /etc/letsencrypt/live/api.fairway.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fairway.click/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 영상 업로드 200MB를 받으려면 기본값 1MB로는 안 된다.
    client_max_body_size 256m;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: 버퍼링하면 이벤트가 모여서 나가고, 타임아웃이 짧으면 연결이 끊긴다.
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        # 업로드를 디스크에 다 받고 넘기지 않고 그대로 흘려보낸다.
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }
}
